apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-go-reporter
  namespace: k8s-reporter
  labels:
    app: k8s-go-reporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-go-reporter
  template:
    metadata:
      labels:
        app: k8s-go-reporter
    spec:
      serviceAccountName: k8s-go-reporter
      containers:
      - name: k8s-go-reporter
        image: k8s-go-reporter:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 50051
          name: grpc
          protocol: TCP
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "500m"

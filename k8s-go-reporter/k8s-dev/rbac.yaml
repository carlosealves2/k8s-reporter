apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-go-reporter
  namespace: k8s-reporter
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-go-reporter-reader
rules:
- apiGroups: [""]
  resources: ["pods","namespaces"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-go-reporter-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-go-reporter-reader
subjects:
- kind: ServiceAccount
  name: k8s-go-reporter
  namespace: k8s-reporter

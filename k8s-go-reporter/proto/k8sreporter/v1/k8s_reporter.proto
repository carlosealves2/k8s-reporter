syntax = "proto3";

package k8sreporter.v1;

option go_package = "k8s-go-reporter/internal/gen/k8sreporter/v1;k8sreporterv1";

// K8sReporterService provides information about Kubernetes resources
service K8sReporterService {
  // ListNamespaces returns all namespaces in the cluster
  rpc ListNamespaces(ListNamespacesRequest) returns (ListNamespacesResponse);

  // ListPods returns all pods in a specific namespace
  rpc ListPods(ListPodsRequest) returns (ListPodsResponse);
}

// ListNamespacesRequest is the request message for listing namespaces
message ListNamespacesRequest {}

// ListNamespacesResponse contains a list of namespace names
message ListNamespacesResponse {
  repeated string namespaces = 1;
}

// ListPodsRequest is the request message for listing pods
message ListPodsRequest {
  string namespace = 1;
}

// Pod represents basic pod information
message Pod {
  string name = 1;
  string namespace = 2;
  string status = 3;
  string node_name = 4;
}

// ListPodsResponse contains a list of pods
message ListPodsResponse {
  repeated Pod pods = 1;
}
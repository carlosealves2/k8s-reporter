# SonarQube Project Configuration
sonar.projectKey=k8s-go-reporter
sonar.projectName=K8s Go Reporter
# Version will be injected by CI/CD pipeline from version file

# Source and test directories
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Exclusions (generated code and protobuf files)
sonar.exclusions=**/gen/**,**/proto/**,**/*.pb.go

# Coverage report
sonar.go.coverage.reportPaths=coverage.out

# Encoding
sonar.sourceEncoding=UTF-8
